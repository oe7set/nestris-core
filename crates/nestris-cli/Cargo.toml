[package]
name = "nestris-cli"
description = "Native frontend: ffmpeg-pipe capture, JSONL/WebSocket sinks, verification commands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nestris"
path = "src/main.rs"

[dependencies]
nestris-engine = { workspace = true, features = ["parallel"] }
nestris-host = { workspace = true }
nestris-ngf = { workspace = true }
nestris-vision = { workspace = true }
png = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
