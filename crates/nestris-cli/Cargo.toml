[package]
name = "nestris-cli"
description = "Native frontend: ffmpeg-pipe capture, JSONL/WebSocket sinks, verification commands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nestris"
path = "src/main.rs"

[dependencies]
nestris-engine = { workspace = true }
nestris-host = { workspace = true }
nestris-ngf = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
toml = "0.9"
serde_yaml_ng = "0.10"
