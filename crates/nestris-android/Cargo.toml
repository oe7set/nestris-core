[package]
name = "nestris-android"
description = "UniFFI bindings stub for the Android frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "nestris_android"

[dependencies]
nestris-engine = { workspace = true }
nestris-vision = { workspace = true }
serde_json = { workspace = true }
uniffi = "0.29"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
