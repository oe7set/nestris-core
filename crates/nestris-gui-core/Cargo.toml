[package]
name = "nestris-gui-core"
description = "GUI-agnostic desktop core shared by the frontends: pipeline worker, settings, session store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nestris-engine = { workspace = true, features = ["parallel"] }
nestris-host = { workspace = true }
nestris-ngf = { workspace = true }
nestris-vision = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(not(windows))'.dependencies]
dirs = "6"

[dev-dependencies]
nestris-ngf = { workspace = true }
