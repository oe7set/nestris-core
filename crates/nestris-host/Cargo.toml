[package]
name = "nestris-host"
description = "Native host utilities shared by the CLI and the desktop GUI: ffmpeg capture, sinks, recalibration thread"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nestris-engine = { workspace = true }
nestris-vision = { workspace = true }
nestris-ngf = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.9"
serde_yaml_ng = "0.10"
# Dedicated half-size pool for background solves so their row-parallel
# kernels never queue-contend with the pipeline thread's global-pool work.
rayon = "1"
tungstenite = "0.28"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
