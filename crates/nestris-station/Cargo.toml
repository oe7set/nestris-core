[package]
name = "nestris-station"
description = "Headless tournament station daemon: live capture, RFID player login, cheat detection, MQTT publishing"
# Own version: it names the .deb rolled out to the stations.
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nestris-station"
path = "src/main.rs"

[features]
default = []
# MQTT over TLS (rustls). Off by default: tournament brokers run on the LAN.
tls = ["rumqttc/use-rustls"]

[dependencies]
nestris-engine = { workspace = true, features = ["parallel"] }
nestris-host = { workspace = true }
nestris-ngf = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rumqttc = { version = "0.25", default-features = false }
# No libudev: port enumeration is not needed (the port is configured by path).
serialport = { version = "4", default-features = false }
tracing = "0.1"
# Recording upload to the NestrisLTM host (plain HTTP on the LAN, no TLS).
ureq = { version = "3", default-features = false }
sha2 = "0.10"
# Release signatures of updates (docs/STATION.md, "Updates").
ed25519-dalek = "2"
base64 = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.5"

[dev-dependencies]
toml = "0.9"

# `cargo deb -p nestris-station` (cargo install cargo-deb) builds the Debian
# package: binary, systemd unit (enabled at boot), config + env templates.
[package.metadata.deb]
name = "nestris-station"
maintainer = "Retroverse (retroverse.at)"
copyright = "Retroverse"
section = "games"
priority = "optional"
depends = "$auto, ffmpeg, adduser"
# Reader firmware updates run esptool (docs/STATION.md, "Updates").
recommends = "esptool"
extended-description = """\
Headless NES-Tetris tournament station: captures the console picture from a \
USB capture device, recognizes score/lines/level and statistics, attributes \
games to the player on the RFID reader, detects the Select score cheat, \
validates every result and publishes everything to the host over MQTT."""
maintainer-scripts = "packaging/debian/"
conf-files = ["/etc/nestris-station/station.toml", "/etc/nestris-station/env"]
assets = [
    ["target/release/nestris-station", "usr/bin/", "755"],
    ["packaging/update-helper", "usr/lib/nestris-station/update-helper", "755"],
    ["packaging/station.example.toml", "etc/nestris-station/station.toml", "640"],
    ["packaging/env.example", "etc/nestris-station/env", "640"],
    ["packaging/station.example.toml", "usr/share/doc/nestris-station/station.example.toml", "644"],
    ["packaging/99-nestris-station.rules", "usr/share/doc/nestris-station/99-nestris-station.rules", "644"],
    ["../../LICENSE", "usr/share/doc/nestris-station/LICENSE", "644"],
    ["../../NOTICE", "usr/share/doc/nestris-station/NOTICE", "644"],
]
# The station itself, and the root helper that installs updates the station
# downloaded (a path unit watching <state>/updates/request + a oneshot service).
systemd-units = [
    { unit-scripts = "packaging/", enable = true, start = false },
    { unit-scripts = "packaging/", unit-name = "nestris-station-update", enable = true, start = true },
]
