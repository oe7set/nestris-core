[package]
name = "nestris-wasm"
description = "wasm-bindgen exports of the engine for the browser GUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack post-processing: aggressive size/speed optimization.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]

[dependencies]
nestris-engine = { workspace = true }
nestris-ngf = { workspace = true }
nestris-vision = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
