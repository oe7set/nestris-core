[package]
name = "nestris-gui"
description = "Native desktop GUI (egui): source picker, live previews, dashboard, events, settings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nestris-gui"
path = "src/main.rs"

[dependencies]
nestris-engine = { workspace = true, features = ["parallel"] }
nestris-host = { workspace = true }
nestris-ngf = { workspace = true }
nestris-vision = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = "0.33"
egui = "0.33"
rfd = "0.15"
