[workspace]
resolver = "3"
members = ["crates/*"]
# The Qt GUI is a standalone workspace: building it needs a Qt SDK (qmake),
# which `cargo build --workspace` must not require.
exclude = ["crates/nestris-qt-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ErwinSpitaler/nestris-core"

[workspace.dependencies]
nestris-vision = { path = "crates/nestris-vision" }
nestris-engine = { path = "crates/nestris-engine" }
nestris-host = { path = "crates/nestris-host" }
nestris-ngf = { path = "crates/nestris-ngf" }
nestris-gui-core = { path = "crates/nestris-gui-core" }
serde = { version = "1", features = ["derive"] }
# preserve_order: the engine replicates Python dict insertion-order semantics
# (STATISTICS fusion), so JSON objects must not be silently re-sorted.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
png = "0.17"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# Fast enough for per-frame CV work while keeping debuggability in dev builds
# of everything above the vision crate.
[profile.dev.package.nestris-vision]
opt-level = 2
