name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Linker inputs for the desktop GUI (eframe/winit) on Linux runners.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Fixture-dependent tests skip themselves when NESTRIS_FIXTURES_DIR is
      # unset; the committed testdata/cv goldens always run.
      - run: cargo test --workspace

  # The Debian package of the headless station (Linux-only systemd/sd-notify
  # paths get compiled and linted here; `cargo test --workspace` above runs
  # its tests on both OSes).
  station-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p nestris-station --all-targets --features tls -- -D warnings
      - run: cargo install cargo-deb --locked
      - run: cargo deb -p nestris-station
      # Install it in a clean container and exercise the update helper.
      - name: Package test
        run: |
          deb=$(ls target/debian/*.deb | head -n 1)
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 sh crates/nestris-station/packaging/test-package.sh "$deb"
      - uses: actions/upload-artifact@v4
        with:
          name: nestris-station-deb
          path: target/debian/*.deb

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p nestris-engine -p nestris-wasm --target wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build crates/nestris-wasm --target web --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # check needs no NDK linker; keeps the UniFFI surface building for ARM.
      - run: cargo check -p nestris-android --target aarch64-linux-android

  # The Qt GUI lives in its own workspace (excluded from the root so a Qt
  # SDK is never required for `cargo build --workspace`); this job is also
  # its fmt/clippy gate, since the root `cargo fmt --all` never reaches it.
  qt:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/nestris-qt-gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/nestris-qt-gui -> target
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
